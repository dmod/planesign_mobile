name: planesign_mobile
description: A mobile app for interacting with a RaspberryPi

publish_to: 'none'

version: 0.2.2+2026073001

environment:
  sdk: ^3.12.0
  flutter: 3.44.9

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5
  flutter_blue_plus: ^2.3.12
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: "launcher_icon"
  min_sdk_android: 32
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"