name: planesign_mobile
description: A mobile app for interacting with a RaspberryPi

publish_to: 'none'

version: 0.3.0+2026090901

environment:
  sdk: ^3.12.0
  flutter: 3.44.9

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5
  flutter_blue_plus: ^2.3.12
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: "launcher_icon"
  min_sdk_android: 32
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/icon/icon.png"

  android_12:
    color: "#ffffff"
    image: "assets/icon/icon.png"

  android: true
  ios: true
  web: false